# Tiap Senin cek semua link sumber di data.js. Kalau ada yang mati (404/410/domain hilang), buka issue
# "Link sumber mati" (label link-mati) atau update isinya kalau sudah ada.
# Kalau semua normal lagi, issue itu ditutup otomatis.
name: Cek link sumber

on:
  schedule:
    - cron: "0 1 * * 1" # Senin 08.00 WIB
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cek link
        id: cek
        continue-on-error: true
        run: node scripts/check-links.mjs > laporan.md
      - name: Buka, update, atau tutup issue
        env:
          GH_TOKEN: ${{ github.token }}
          GAGAL: ${{ steps.cek.outcome == 'failure' }}
        run: |
          n=$(gh issue list --label link-mati --state open --json number -q '.[0].number')
          if [ "$GAGAL" = true ]; then
            if [ -n "$n" ]; then
              gh issue edit "$n" --body-file laporan.md
            else
              gh issue create --title "Link sumber mati" --label link-mati --body-file laporan.md
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Semua link sumber normal lagi."
          fi
